<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Echoes – Play</title>
  <link rel="stylesheet" href="style.css?v=80">
</head>
<body>
  <header class="top">
    <div class="brand">
      <a class="logo" href="index.html">Echoes</a>
      <div class="sub" id="dayLabel"></div>
    </div>
    <nav class="nav">
      <button class="circle" id="helpBtn" aria-label="?">?</button>
    </nav>
  </header>

  <main class="stage">
    <section class="play">
      <div class="name-it" id="nameIt" hidden></div>
      <div class="timeline" id="timeline">
        <div class="year-display">
          <button class="nudge" data-step="-1" aria-label="-1">‹</button>
          <input type="number" id="yearInput" min="1700" max="2026">
          <button class="nudge" data-step="1" aria-label="+1">›</button>
        </div>
        <div class="year-track">
          <div class="year-marks" id="yearMarks"></div>
          <div class="year-window" id="yearWindow" hidden></div>
          <input type="range" id="yearRange" min="1700" max="2026" step="1">
        </div>
        <div class="ticks" id="ticks"></div>
        <p class="year-possible" id="yearPossible" hidden></p>
      </div>

      <div class="globe-wrap">
        <div class="globe-lens"><svg id="globe" viewBox="20 20 460 460" aria-label="Globe"></svg></div>
        <div class="zoom">
          <button class="circle" id="zoomIn">+</button>
          <button class="circle" id="zoomOut">−</button>
        </div>
      </div>

      <div class="tries" id="tries"></div>
      <span class="hold-pill"><button class="pill" id="guessBtn"></button><svg class="pill-ring" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="999" pathLength="100"></rect></svg></span>
      <p class="hint" id="playHint"></p>
    </section>

    <section class="center">
      <div id="voice"></div>
      <nav class="pager" id="pager"></nav>
    </section>

    <aside class="panel">
      <div class="panel-block">
        <div class="score-line"><span class="score-num" id="score"></span><span class="label" id="scoreLabel"></span></div>
      </div>
      <div class="next-wrap" id="nextWrap">
        <span class="hold-pill"><button class="pill next" id="nextBtn"></button><svg class="pill-ring" aria-hidden="true"><rect x="0" y="0" width="100%" height="100%" rx="999" pathLength="100"></rect></svg></span>
        <div class="next-caption" id="nextCaption"></div>
      </div>
    </aside>
  </main>

  <p class="ai-note">All voices are fictional and AI-generated, based on real eyewitness accounts. · <a href="privacy.html">Privacy</a></p>

  <footer class="foot">
    <span id="protoLabel"></span>
    <span id="dayLinks"></span> ·
    <button class="link" id="resetBtn"></button>
  </footer>

  <script src="vendor/d3.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="days.js?v=80"></script>
  <script src="common.js?v=80"></script>
  <script src="account.js?v=80"></script>
  <script src="stats.js?v=80"></script>
  <script src="game.js?v=80"></script>
</body>
</html>
